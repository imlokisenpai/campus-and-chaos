name: Deploy yearbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't let two deploys race; keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # bundler-cache: true installs the Gemfile and caches it.
      # This is what pins Jekyll 4.4 + sass-embedded (Dart Sass), which
      # is required for the `@use` syntax in _sass/.
      #
      # Deliberately NOT using actions/jekyll-build-pages: it builds
      # inside a container that ignores the Gemfile and falls back to
      # Jekyll 3.x, whose Sass can't read `@use` — main.scss then ships
      # to the site uncompiled and the whole theme dies.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: >-
          bundle exec jekyll build
          --destination _site
          --baseurl "${{ steps.pages.outputs.base_path }}"
          --trace

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4